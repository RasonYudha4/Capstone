events{}

http {
    client_max_body_size 20M; 

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/m;

    server {
        listen 80;
        add_header Access-Control-Allow-Origin http://localhost:5173 always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /documents {
            if ($request_method = OPTIONS) {
            return 204;
            }
            proxy_pass http://document-service:8081/documents;
            proxy_set_header Host $host;
            proxy_hide_header X-Frame-Options;
            limit_req zone=mylimit burst=20 nodelay;
            limit_req_status 429;

        }

        location /audit {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://document-service:8081/audit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;       
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        }

        location /notification {
            if ($request_method = OPTIONS) {
            return 204;
            }
            proxy_pass http://document-service:8081/notification;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;       
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s; 

        }

        location /form-option{
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://document-service:8081/form-option;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;       
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        }

        location /auth {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://auth-service:8089/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;       
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            limit_req zone=mylimit burst=10 nodelay;
            limit_req_status 429;           
        }

        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            if ($request_method = OPTIONS) {
            return 204;
            }
        }

        location /query {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://host.docker.internal:8001/query;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 
            # Streaming-critical settings
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
        }

        location /ingest {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://host.docker.internal:8001/ingest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
        }
        
        location / {
           return 444;
        }
        location ~ /\. {
            deny all;
        }


    }
}
