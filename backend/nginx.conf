events{}

http {
    client_max_body_size 20M; 

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/m;

    server {
        listen 80;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /documents {
            if ($request_method = OPTIONS) {
            return 204;
            }
            proxy_pass http://document-service:8081/documents;
            proxy_set_header Host $host;
            proxy_hide_header X-Frame-Options;
            limit_req zone=mylimit burst=20 nodelay;
        }

        location /audit {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://document-service:8081/audit;
            proxy_set_header Host $host;
        }

        location /notification {
            if ($request_method = OPTIONS) {
            return 204;
            }
            proxy_pass http://document-service:8081/notification;
            proxy_set_header Host $host;
        }

        location /form-option{
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://document-service:8081/form-option;
            proxy_set_header Host $host;
        }

        location /auth {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://auth-service:8089/auth;
            proxy_set_header Host $host;
        }

        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }
    }
}