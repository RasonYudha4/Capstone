services:

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - document-service
      - minio
      - auth-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - server
  postgres:
    image: postgres:18
    container_name: postgre
    restart: unless-stopped
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    ports:
      - "5433:5432"
    volumes:
      - data_db:/var/lib/postgresql
      - ./migration/0001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./migration/0002_seed.up.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./migration/0003_user_invitation.up.sql:/docker-entrypoint-initdb.d/03_user_invitation.sql
      - ./migration/0004_auth_hardening.up.sql:/docker-entrypoint-initdb.d/04_auth_hardening.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d capstone_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - server
   
  minio:
    image: quay.io/minio/aistor/minio
    container_name: object-storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9100:9100"
    volumes:
      - ./data:/mnt/data
    command: server /mnt/data --console-address ":9100" 
    networks:
      - server

  document-service:
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
    container_name: document-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    environment:
      SLEEP_BEFORE_START: 10
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - server

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    environment:
      SLEEP_BEFORE_START: 10
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8089/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    dns:
      - 8.8.8.8  
    networks:
      - server
      
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - server

networks:
  server:
    driver: bridge


volumes:
  postgres_data:
  pgadmin_data:
  agent_venv:
  data_db: 
  